name: NeutrinBrowser
options:
  bundleIdPrefix: com.lfaz
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NeutrinBrowser:
    type: application
    platform: iOS
    sources:
      - path: NeutrinBrowser
        excludes:
          - Info.plist
          - Resources/Scripts/**
      # Page scripts, the filter converter and Readability are loaded from the bundle at runtime.
      - path: NeutrinBrowser/Resources/Scripts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neutrin.browser.ios
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: NeutrinBrowser/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
  NeutrinBrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NeutrinBrowserTests]
    dependencies:
      - target: NeutrinBrowser
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  NeutrinBrowser:
    build:
      targets:
        NeutrinBrowser: all
        NeutrinBrowserTests: [test]
    test:
      targets: [NeutrinBrowserTests]
